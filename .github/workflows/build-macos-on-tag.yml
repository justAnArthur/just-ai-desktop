# build-macos-on-tag.yml
# ---
# builds AI Desktop for a release tag (`just-ai-desktop@x.y.z`) and attaches the zipped app to that tag's
# GitHub release (created by release-on-tag.yml from the same tag).
#
# the app builds only inside the just-apps platform (workspace packages, crates/app-core), so this
# checks out just-apps and puts this repo at apps/ai-desktop. the PLATFORM_TOKEN secret is a
# fine-grained token with read access to the just-apps repo.
#
# bump-version.yml dispatches this workflow for every new tag that matches `push.tags`, passing the
# tag as the `tag` input — keep that input.
#
# self-update: the build also makes the updater's bundle (`just-ai-desktop.app.tar.gz`, signed with the
# TAURI_SIGNING_PRIVATE_KEY secret, whose public key is `updater.pubkey` in app.json) and a `latest.json`
# pointing at it. The app reads releases/latest/download/latest.json, so this repo must be public.
#
# code signing: with the MACOS_CERT_P12 (base64) and MACOS_CERT_PASSWORD secrets, the app is signed with
# that long-lived (self-signed) certificate, so its identity, and with it macOS privacy permissions,
# stays the same across updates. Without them it is ad-hoc signed. Either way it is not notarized: the
# first, manual install needs right-click → Open, or `xattr -dr com.apple.quarantine "AI Desktop.app"`;
# updates the app installs itself are not quarantined.
# ---
name: build-macos-on-tag
run-name: "macOS app — ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: [ "just-ai-desktop@*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. "just-ai-desktop@0.2.0")'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/just-apps
          token: ${{ secrets.PLATFORM_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: apps/ai-desktop

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: bun install

      - name: Signing keychain
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning title=Ad-hoc signed::the MACOS_CERT_P12 secret is missing, so this build is ad-hoc signed and users lose privacy permissions when they update to it"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -p codesigning "$keychain" | awk -F'"' '/"/ { print $2; exit }')"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: bun run app build ai-desktop --target universal-apple-darwin --bundles app

      - name: Package
        id: pkg
        run: |
          version="${TAG#just-ai-desktop@}"
          dir="target/universal-apple-darwin/release/bundle/macos"
          zip="just-ai-desktop-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent "$dir/AI Desktop.app" "$zip"
          cp "$dir/AI Desktop.app.tar.gz" just-ai-desktop.app.tar.gz
          url="https://github.com/${{ github.repository }}/releases/download/${TAG/@/%40}/just-ai-desktop.app.tar.gz"
          # One universal bundle serves both architectures.
          jq -n --arg v "$version" --arg sig "$(cat "$dir/AI Desktop.app.tar.gz.sig")" --arg url "$url" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' > latest.json
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the working directory is the just-apps checkout; the release belongs to this repo.
          GH_REPO: ${{ github.repository }}
        run: |
          # release-on-tag.yml creates the release from the same tag, possibly after this build starts.
          for _ in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" just-ai-desktop.app.tar.gz latest.json --clobber

      - name: Delete the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"
